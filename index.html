<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #f4f4f4;
            color: #333;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .selected-item {
            border-color: #dc2626 !important;
            background: #fef2f2 !important;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.2);
        }
        .btn-primary {
            background: #dc2626;
            color: white;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #b91c1c;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }
    </style>
    <title>FF Store ID - Merah Putih</title>
</head>
<body class="min-h-screen p-4 pb-20">

    <div class="max-w-xl mx-auto space-y-6">
        <div class="text-center py-6 bg-white rounded-3xl shadow-sm border-b-4 border-red-600">
            <h1 class="cyber-font text-3xl font-black text-red-600 tracking-tighter uppercase italic">
                FF <span class="text-yellow-500">STORE</span> ID
            </h1>
            <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase">Top Up Tercepat & Terpercaya</p>
        </div>

        <div class="glass p-5 rounded-3xl border-t-4 border-red-600">
            <h2 class="font-bold uppercase tracking-wider mb-4 flex items-center gap-2 text-red-600">
                <span class="bg-yellow-400 text-red-700 px-2 py-0.5 rounded text-xs font-black">01</span> PLAYER ID
            </h2>
            <input id="userId" type="number" placeholder="Masukkan ID Game" 
                class="w-full bg-gray-50 border-2 border-gray-200 p-4 rounded-2xl focus:border-red-600 outline-none text-xl font-bold transition-all">
        </div>

        <div class="glass p-5 rounded-3xl border-t-4 border-red-600">
            <h2 class="font-bold uppercase tracking-wider mb-4 flex items-center gap-2 text-red-600">
                <span class="bg-yellow-400 text-red-700 px-2 py-0.5 rounded text-xs font-black">02</span> PILIH NOMINAL
            </h2>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="selectPack(this, '5 Dm', '1.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">5 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 1rb</div>
                </button>
                <button onclick="selectPack(this, '12 Dm', '2.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">12 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 2rb</div>
                </button>
                <button onclick="selectPack(this, '50 Dm', '8.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">50 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 8rb</div>
                </button>
                <button onclick="selectPack(this, '70 Dm', '10.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">70 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 10rb</div>
                </button>
                <button onclick="selectPack(this, '140 Dm', '20.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">140 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 20rb</div>
                </button>
                <button onclick="selectPack(this, '355 Dm', '50.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">355 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 50rb</div>
                </button>
                <button onclick="selectPack(this, '720 Dm', '100.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">720 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 100rb</div>
                </button>
                <button onclick="selectPack(this, '1440 Dm', '200.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">1440 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 200rb</div>
                </button>
                <button onclick="selectPack(this, '2180 Dm', '300.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">2180 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 300rb</div>
                </button>
                <button onclick="selectPack(this, '7290 Dm', '1.000.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">7290 Dm</div>
                    <div class="text-sm font-black text-red-600">Rp 1jt</div>
                </button>
                <button onclick="selectPack(this, 'Mingguan', '28.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center bg-yellow-50">
                    <div class="text-[10px] text-yellow-600 font-bold">MEMBER</div>
                    <div class="text-sm font-black text-red-600">Rp 28rb</div>
                </button>
                <button onclick="selectPack(this, 'Bulanan', '85.000')" class="pack-btn glass p-3 rounded-xl hover:border-red-600 transition-all text-center bg-yellow-50">
                    <div class="text-[10px] text-yellow-600 font-bold">MEMBER</div>
                    <div class="text-sm font-black text-red-600">Rp 85rb</div>
                </button>
            </div>
        </div>

        <div class="glass p-5 rounded-3xl border-t-4 border-red-600">
            <h2 class="font-bold uppercase tracking-wider mb-4 flex items-center gap-2 text-red-600">
                <span class="bg-yellow-400 text-red-700 px-2 py-0.5 rounded text-xs font-black">03</span> METODE BAYAR
            </h2>
            <div onclick="selectPayment(this)" id="paymentBox" class="flex items-center gap-4 p-4 border-2 border-gray-100 rounded-2xl cursor-pointer hover:bg-red-50 transition-all">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg" class="h-6" alt="QRIS">
                <span class="font-bold text-sm uppercase text-gray-700">QRIS (Ovo, Dana, Gopay)</span>
            </div>
        </div>

        <button onclick="handleBayar()" class="w-full btn-primary font-black py-5 rounded-2xl text-lg cyber-font">
            BAYAR SEKARANG
        </button>
    </div>

    <div id="qrModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-40 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center space-y-6">
            <h3 class="font-bold text-red-600 cyber-font">SILAKAN SCAN QRIS</h3>
            <div class="mx-auto w-56 h-56 border-4 border-red-600 p-2 rounded-2xl">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=FF_Store_Payment" class="w-full h-full">
            </div>
            <p id="totalTagihan" class="text-3xl font-black text-gray-800 italic">Rp 0</p>
            <button onclick="openConfirmModal()" class="w-full btn-primary py-4 rounded-2xl font-black uppercase">SAYA SUDAH BAYAR</button>
            <button onclick="closeModal('qrModal')" class="text-gray-400 text-xs font-bold uppercase underline">Batal</button>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-50 hidden">
        <div class="bg-white w-full max-w-xs rounded-3xl p-8 text-center space-y-6">
            <p class="text-gray-700 font-bold uppercase text-sm">Konfirmasi Pembayaran?</p>
            <div class="flex flex-col gap-3">
                <button onclick="prosesBerhasil()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl uppercase">YA, SUDAH BAYAR</button>
                <button onclick="closeModal('confirmModal')" class="w-full bg-gray-100 text-gray-500 py-3 rounded-xl">BELUM</button>
            </div>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 bg-white flex items-center justify-center p-6 z-[60] hidden">
        <div class="text-center space-y-6 w-full max-w-xs">
            <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto shadow-xl">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <div>
                <h2 class="text-2xl font-black text-red-600 italic cyber-font">BERHASIL!</h2>
                <p class="text-green-600 font-bold uppercase text-xs">Selamat Pembayaran Berhasil</p>
            </div>
            <div class="bg-gray-50 p-5 rounded-3xl text-left space-y-2 text-xs border-2 border-red-100">
                <div class="flex justify-between"><span>ID PLAYER:</span><span id="finalId" class="text-gray-800 font-black"></span></div>
                <div class="flex justify-between"><span>PRODUK:</span><span id="finalPack" class="text-red-600 font-black"></span></div>
            </div>
            <button onclick="location.reload()" class="w-full btn-primary py-4 rounded-2xl font-black uppercase">KEMBALI</button>
        </div>
    </div>

    <script>
        let selectedLabel = "";
        let selectedPrice = "0";
        let isPaymentSelected = false;

        function selectPack(el, label, price) {
            document.querySelectorAll('.pack-btn').forEach(btn => btn.classList.remove('selected-item'));
            el.classList.add('selected-item');
            selectedLabel = label;
            selectedPrice = price;
        }

        function selectPayment(el) {
            document.getElementById('paymentBox').classList.add('selected-item');
            isPaymentSelected = true;
        }

        function handleBayar() {
            const id = document.getElementById('userId').value;
            if (!id) { alert("Masukkan ID dulu Bos!"); return; }
            if (!selectedLabel) { alert("Pilih Diamondnya!"); return; }
            if (!isPaymentSelected) { alert("Pilih Metode Bayar!"); return; }
            document.getElementById('totalTagihan').innerText = "Rp " + selectedPrice;
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function openConfirmModal() {
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function prosesBerhasil() {
            document.getElementById('qrModal').classList.add('hidden');
            document.getElementById('confirmModal').classList.add('hidden');
            document.getElementById('finalId').innerText = document.getElementById('userId').value;
            document.getElementById('finalPack').innerText = selectedLabel;
            document.getElementById('successModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
